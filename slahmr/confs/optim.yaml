optim:
  options:
    robust_loss_type: "bisquare"
    robust_tuning_const: 4.6851
    joints2d_sigma: 100.0
    lr: 1.0
    lbfgs_max_iter: 20
    save_every: 20
    vis_every: -1
    max_chunk_steps: 20
    save_meshes: False

  root:
    num_iters: 30

  smpl:
    num_iters: 0

  smooth:
    opt_scale: False
    num_iters: 60

  motion_chunks:
    chunk_size: 10
    init_steps: 20
    chunk_steps: 20
    opt_cams: False

  loss_weights:
          #joints2d: [10000000.01, 100000.01, 0.001]
          # 0.01, 100, 0.01
          #joints2d: [0.01, 0.01, 10.0]
    joints2d: [0.01, 0.01, 0.01]
    #joints23d: [100.0, 0.01, 0.001]
    joints23d: [1000.0, 1.0, 0.0]
    bg2d: [0.01, 1.0, 1.0]
    #bg2d: [1.01, 1, 10.0]
    cam_R_smooth : [0.0, 0.0, 0.0]
    cam_t_smooth : [0.0, 0.0, 0.0]
      #    bg2d: [0.0, 0.0001, 0.0001]
      #    cam_R_smooth : [0.0, 1000.0, 1000.0]
      #    cam_t_smooth : [0.0, 1000.0, 1000.0]
    joints3d: [0.0, 0.0, 0.0]
    joints3d_smooth: [1000.0, 1000.0, 0.0]
    joints3d_rollout: [0.0, 0.0, 0.0]
    verts3d: [0.0, 0.0, 0.0]
    points3d: [0.0, 0.0, 0.0]
    pose_prior: [0.04, 0.04, 0.04]
    hand_pose_smooth: [0.0, 4.0, 4.0]
    shape_prior: [0.05, 0.05, 0.05]
    motion_prior: [0.0, 0.0, 0.075]
    init_motion_prior: [0.0, 0.0, 0.075]
    joint_consistency: [0.0, 0.0, 100.0]
