name: slahmr
channels:
  - conda-forge
  - pytorch
  - nvidia
  - rusty1s
dependencies:
  - python=3.9
  - pytorch
  - pytorch-cuda=11.7
  - torchvision
  - pytorch-scatter
  - suitesparse
  - ffmpeg
  - vrs
  - pip
  - pip:
    - git+https://github.com/facebookresearch/detectron2.git
    - git+https://github.com/brjathu/pytube.git
    - git+https://github.com/nghorbani/configer
    - git+https://github.com/mattloper/chumpy
    - setuptools==68.2.2
    - torchgeometry==0.1.2
    - tensorboard
    - smplx
    # pyrender's headless (pyopengl.PLATFORM=osmesa/egl) rendering only works
    # reliably pinned at exactly this version -- 3.1.0 is what pyrender 0.1.45
    # itself requires; newer PyOpenGL doesn't fix osmesa's libLLVM/libffi ABI
    # issues and isn't needed once EGL is used instead (see third-party/ViTPose
    # fork's mmpose/core/visualization/image.py)
    - pyopengl==3.1.0
    - pyrender
    - open3d
    - imageio-ffmpeg
    - matplotlib
    - opencv-python
    - scipy
    - scikit-image
    - scikit-learn==0.22
    - joblib
    - cython
    - tqdm
    - hydra-core
    - pyyaml
    - gdown
    - dill
    - huggingface_hub
    - motmetrics
    - scenedetect[opencv]
    - einops
    - mmcv==1.3.9
    - timm==0.4.9
    - xtcocotools==1.10
    - pandas==1.4.0
